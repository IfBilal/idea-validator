# Required checks on main (Guide §8.1).
# ui-tests and docker-ui arrived with services/ui. Jobs for retrieval-gate and check_registry land with the PRs that add
# eval/retrieval and the registry script; adding them earlier would only produce permanently red checks.
name: pr-checks
on: pull_request
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run lint-imports
      - run: uv run mypy
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -q -m "not integration" --cov --cov-report=term
      - run: uv run pytest services/verdict -q          # Verdict Engine unit tests + golden vectors (required)
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -q -m integration            # testcontainers: Postgres, Redis, Qdrant
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --frozen
      - run: uv run pytest libs/common/tests/test_schema_drift.py -q
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, profile, orchestrator, scouts, tools, kb, analyst, ideation, validators, scorer, verdict, critic, agentops]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: ${{ matrix.service }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "${{ matrix.service }}:${{ github.sha }}", exit-code: "1", severity: "CRITICAL", ignore-unfixed: true, version: "v0.76.2" }
  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
  docker-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/ui
          tags: ui:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "ui:${{ github.sha }}", exit-code: "1", severity: "CRITICAL", ignore-unfixed: true, version: "v0.76.2" }
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with pyyaml python scripts/gen_k8s.py --check   # manifests match the generator
      - run: kubectl kustomize --load-restrictor=LoadRestrictionsNone k8s/overlays/dev > /tmp/all.yaml
      - run: docker run --rm -v /tmp:/w ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /w/all.yaml
      - run: docker run --rm -v /tmp:/w stackrox/kube-linter:v0.6.8 lint /w/all.yaml
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: astral-sh/setup-uv@v6
      - run: uvx pip-audit --strict || true            # make blocking once deps settle (P2)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: ".", exit-code: "1", severity: "CRITICAL", scanners: "vuln,secret,misconfig", version: "v0.76.2" }
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: wagoid/commitlint-github-action@v6
