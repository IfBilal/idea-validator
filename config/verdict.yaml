# M11 Verdict Engine rules -> mounted as ConfigMap `verdict-config` at /etc/idea-validator/verdict.yaml
# Starting values from Description §5.3. Tuned in Phase 10 (Guide §10). Any change => bump weights_version /
# thresholds_version, run the evaluation harness, write an ADR, show before/after confusion matrices in the report.
engine_version: "m11@v1"
weights_version: "w1"
thresholds_version: "t1"
rubric_set: "r1"            # maps to rubrics/<dimension>@v1.yaml (see rubric_versions)
rubric_versions:
  demand_pain: "demand_pain@v1"
  competition: "competition@v1"
  differentiation: "differentiation@v1"
  feasibility: "feasibility@v1"
  risk: "risk@v1"
  learning: "learning@v1"

weights:                    # each goal's weights add to 100 (validated at startup)
  startup:        { demand_pain: 25, competition: 20, differentiation: 20, feasibility: 15, risk: 15, learning: 5 }
  portfolio:      { demand_pain: 15, competition: 15, differentiation: 15, feasibility: 25, risk: 10, learning: 20 }
  course_project: { demand_pain: 10, competition: 10, differentiation: 15, feasibility: 35, risk: 10, learning: 20 }

thresholds:
  T_go: 70
  T_no: 50
  floor: 1.5                # applies to the first five dimensions only (not learning)

confidence:
  min: 0.5                  # below -> INSUFFICIENT_EVIDENCE
  w_dims: 0.7
  w_sources: 0.3
  sources_full: 5           # min(1, sources / 5)

gates:
  min_sources: 3
  min_platforms: 2
  duplicate_diff_override: 3.0   # duplicate gate passes if differentiation >= 3

challenge:
  score_step: 0.5
  score_max: 1.0
  conf_step: 0.1

sensitivity:
  weight_delta: 0.20        # relative (25 -> 20), difference shared in proportion among the others
  score_delta: 1.0          # least-confident score +/- 1

whatif:
  step: 0.5
  max_candidates: 3

scoring_blend:
  alpha_model: 0.6          # final = alpha*model + (1-alpha)*feature_prior, rounded to 0.5 (ADR-006)
