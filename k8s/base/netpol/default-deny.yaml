# Global rules (hand-written). Per-service ingress/egress pairs and the tools internet egress are GENERATED:
# see k8s/base/netpol/services.yaml, tools-internet.yaml and scripts/gen_k8s.py.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: idea-validator }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns, namespace: idea-validator }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
# UI reaches the API gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ui-egress-gateway-only, namespace: idea-validator }
spec:
  podSelector: { matchLabels: { app: ui } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: gateway } } }]
      ports: [{ protocol: TCP, port: 8000 }]
