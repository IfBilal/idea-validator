# Rubric file (Guide §10). One versioned file per dimension, anchor for every score 0..5,
# at least one worked example per level. A change => new version file + new evaluation run (M13-04).
dimension: competition
version: 1
id: "competition@v1"
scale: 0-5      # higher is better for the student; half points allowed between anchors
description: "Room to enter: few or weak direct competitors (higher is better for the student)."
anchors:
  5: "No direct competitor in the KB for this user and core features; niche rising."
  4: "One or two small/early competitors (unfunded, few stars/votes); niche not saturated."
  3: "Several competitors but none dominant; clear room in a segment."
  2: "Many competitors or one well-funded leader; niche flat."
  1: "Crowded: many well-funded/launched competitors; niche saturated."
  0: "Dominated by large incumbents with the same core features for the same user."
features: [n_competitors, competitor_strength, niche_saturation]
feature_prior:  # deterministic prior from computed features (0..5); blended with model judgment (alpha in config/verdict.yaml)
  - { when: "n_competitors == 0 and niche_saturation == 0", score: 5 }
  - { when: "n_competitors <= 2 and competitor_strength < 0.4", score: 4 }
  - { when: "n_competitors <= 5 and niche_saturation < 1", score: 3 }
  - { when: "n_competitors <= 10", score: 2 }
  - { when: "niche_saturation == 1", score: 1 }
  - { when: "true", score: 0 }
evidence_rule: "Every score cites evidence ids from the provided EVIDENCE block. No valid evidence -> abstain (score null, confidence 0)."
output_schema: score, confidence, evidence_ids, reason
examples:
  - { level: 5, input: "TODO(Phase 5): real idea + evidence ids from the KB at this level", expected: { score: 5, evidence_ids: ["card_xxxxxxxx#c0"] } }
  - { level: 4, input: "TODO(Phase 5): real idea + evidence ids from the KB at this level", expected: { score: 4, evidence_ids: ["card_xxxxxxxx#c0"] } }
  - { level: 3, input: "TODO(Phase 5): real idea + evidence ids from the KB at this level", expected: { score: 3, evidence_ids: ["card_xxxxxxxx#c0"] } }
  - { level: 2, input: "TODO(Phase 5): real idea + evidence ids from the KB at this level", expected: { score: 2, evidence_ids: ["card_xxxxxxxx#c0"] } }
  - { level: 1, input: "TODO(Phase 5): real idea + evidence ids from the KB at this level", expected: { score: 1, evidence_ids: ["card_xxxxxxxx#c0"] } }
  - { level: 0, input: "TODO(Phase 5): real idea + evidence ids from the KB at this level", expected: { score: 0, evidence_ids: ["card_xxxxxxxx#c0"] } }
