[project]
name = "idea-validator-ingestion"
version = "0.1.0"
description = "M6i ingestion job: raw scout items -> deduplicated idea cards -> M6, plus snapshot and restore"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idea-validator-common",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

# nearest-config wins in ruff, so inherit the root rules and tell isort where this package lives
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
