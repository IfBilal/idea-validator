[project]
name = "idea-validator-finetune"
version = "0.1.0"
description = "M10t fine-tuning pipeline (pure-Python parts; GPU deps live in requirements-gpu.txt)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idea-validator-common",
    "idea-validator-scorer",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }
idea-validator-scorer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finetune"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
