[project]
name = "idea-validator-evaluation"
version = "0.1.0"
description = "M13 evaluation harness: agreement metrics, verdict tuning and the baseline gate"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idea-validator-common",
    # Offline tooling only: tuning re-runs the pure M11 engine in-process (never used by a service).
    "idea-validator-verdict",
    "pyyaml>=6.0",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }
idea-validator-verdict = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]
