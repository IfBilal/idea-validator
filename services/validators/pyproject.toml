[project]
name = "idea-validator-validators"
version = "0.1.0"
description = "M9 Validation agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idea-validator-common",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_validators"]

# nearest-config wins in ruff, so inherit the root rules and tell isort where this package lives
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
