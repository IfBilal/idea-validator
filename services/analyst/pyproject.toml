[project]
name = "idea-validator-analyst"
version = "0.1.0"
description = "M7 Niche and Trend Analyst"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idea-validator-common",
    "uvicorn>=0.32",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_analyst"]

# nearest-config wins in ruff, so inherit the root rules and tell isort where this package lives
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
