[project]
name = "idea-validator-profile"
version = "0.1.0"
description = "M2 Profile, Session and Cache"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idea-validator-common",
    "uvicorn>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_profile"]

# nearest-config wins in ruff, so inherit the root rules and tell isort where this package lives
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
