[project]
name = "idea-validator-kb"
version = "0.1.0"
description = "M6 Knowledge Base"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastembed>=0.5",
    "idea-validator-common",
    "qdrant-client>=1.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.32",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_kb"]

# nearest-config wins in ruff, so inherit the root rules and tell isort where this package lives
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
