[project]
name = "idea-validator-agentops"
version = "0.1.0"
description = "M13 AgenticOps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "idea-validator-common",
    "idea-validator-verdict",  # replay re-runs the pure M11 engine in-process
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn>=0.32",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }
idea-validator-verdict = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_agentops", "src/agentops"]

# nearest-config wins in ruff, so inherit the root rules and tell isort where this package lives
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
