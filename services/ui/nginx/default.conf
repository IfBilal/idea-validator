# nginx-unprivileged: listens on 8080 as uid 101, root filesystem read-only (writes only under /tmp).
# /tmp/headers.conf and /tmp/config.js are generated at start by 40-runtime-config.sh from API_BASE_URL.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # add_header is not inherited into a location that has its own add_header, so every location
    # includes the generated headers file (security headers + CSP that allows only our API origin).
    include /tmp/headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration: never cached, so a changed API address applies on the next load.
    location = /config.js {
        alias /tmp/config.js;
        default_type application/javascript;
        include /tmp/headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        include /tmp/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths serve index.html (the router shows its own 404 page).
    location / {
        include /tmp/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
