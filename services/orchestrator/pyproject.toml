[project]
name = "idea-validator-orchestrator"
version = "0.1.0"
description = "M3 Orchestrator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idea-validator-common",
    "langgraph==1.0.10",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "redis>=8.2.0",
    "uvicorn>=0.32",
]

[tool.uv.sources]
idea-validator-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_orchestrator"]

# nearest-config wins in ruff, so inherit the root rules and tell isort where this package lives
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src"]
