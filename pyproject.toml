# Root of the uv workspace (virtual root: no project of its own).
# Every service/job/lib is a workspace member with its own pyproject.toml; one uv.lock pins them all.
[tool.uv.workspace]
members = ["libs/*", "services/*", "jobs/*"]
exclude = ["services/ui"]

[dependency-groups]
dev = [
    "ruff>=0.17",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "respx>=0.22",
    "pre-commit>=4.0",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
    "testcontainers[postgres,redis]>=4.8",
    "import-linter>=2.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["eval/verdict/reference_engine.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S608", "E501"]
# one-off helper scripts: gh CLI calls are their purpose; long data tables
"scripts/*.py" = ["S603", "S607", "E501", "SIM115"]
# generated by Alembic; long lines are expected
"**/migrations/versions/*.py" = ["E501", "Q000"]

[tool.mypy]
python_version = "3.12"
files = ["libs", "services"]
exclude = ["services/profile/tests/integration/conftest.py"]  # same module name as the verdict one
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q -p common.testing"
testpaths = ["libs", "services", "jobs", "eval"]
markers = ["integration: needs Postgres/Redis/Qdrant (testcontainers; needs a running Docker)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Layering (docs/harness/21 §2): api -> services -> repositories. Checked by `lint-imports`.
[tool.importlinter]
root_packages = ["svc_profile", "svc_gateway"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "profile: routes never touch the database layer"
type = "forbidden"
source_modules = ["svc_profile.api"]
forbidden_modules = ["svc_profile.repositories"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "profile: services never import the web framework"
type = "forbidden"
source_modules = ["svc_profile.services", "svc_profile.repositories"]
forbidden_modules = ["fastapi", "starlette"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "profile: lower layers never import higher ones"
type = "layers"
layers = ["svc_profile.api", "svc_profile.services", "svc_profile.repositories"]

[[tool.importlinter.contracts]]
name = "gateway: routes never call the upstream client's transport directly"
type = "forbidden"
source_modules = ["svc_gateway.api"]
forbidden_modules = ["httpx", "redis"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "gateway: services never import the web framework"
type = "forbidden"
source_modules = ["svc_gateway.services", "svc_gateway.clients"]
forbidden_modules = ["fastapi", "starlette"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "gateway: lower layers never import higher ones"
type = "layers"
layers = ["svc_gateway.api", "svc_gateway.services", "svc_gateway.clients"]
