# DEVELOPMENT ONLY (Guide 4.3). The deployment target is Kubernetes (k8s/, `make deploy`).
# `make up` first fills the missing POSTGRES_* / DATABASE_URL / REDIS_URL in the git-ignored .env
# (random password, never committed), then `docker compose up --wait` until every service is healthy.
# Host ports are overridable (POSTGRES_PORT, REDIS_PORT, QDRANT_PORT) when something else already uses them.
# Images are pinned to the same versions as k8s/base/data (generated by scripts/gen_k8s.py).
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?run make dev-env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run make dev-env}"
      POSTGRES_DB: "${POSTGRES_DB:?run make dev-env}"
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4.6-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 5s, retries: 12 }
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports: ["${QDRANT_PORT:-6333}:6333"]
    volumes: [qdrant:/qdrant/storage]
    # the image has no curl or wget: a TCP connect from bash proves the API port is listening
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes: { pgdata: {}, qdrant: {} }
