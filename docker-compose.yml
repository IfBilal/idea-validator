# DEVELOPMENT ONLY (Guide §4.3). The deployment target is Kubernetes. Pin image tags/digests in Phase 0.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  qdrant:
    image: qdrant/qdrant:latest-PIN-ME   # pin exact version in P0-T06
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
  # Services are added here as they are built (P1+): each with build: ./services/<name>, env_file: .env,
  # environment pointing to service DNS names (never localhost inside images).
volumes: { pgdata: {}, qdrant: {} }
